# Шаблон для /etc/nginx/sites-available/nizkiy-profil
# Замените nizkiyprofil.ru на ваш домен перед установкой.

server {
    listen 80;
    listen [::]:80;
    server_name nizkiyprofil.ru www.nizkiyprofil.ru;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Второй рубеж после Flask: служебные папки и файлы наружу не отдаём
    location ~ ^/(server|deploy|tools|graphify-out)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(py|pyc|log|docx|bat|env)$ {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
